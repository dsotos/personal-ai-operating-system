<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0,0,1320,900" role="img" aria-labelledby="title desc">
  <title id="title">Personal AI Operating System architecture</title>
  <desc id="desc">Hermes orchestrates specialist agents and uses Obsidian as the private, persistent knowledge hub. Tools and sources provide inputs. External actions pass through human approval, and verified outcomes are recorded back to Obsidian.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .muted { fill: #5b667a; }
      .tiny { font-size: 13px; letter-spacing: .08em; font-weight: 700; }
      .label { font-size: 15px; font-weight: 650; }
      .body { font-size: 14px; }
      .white { fill: #ffffff !important; }
      .soft-white { fill: #ede9fe !important; }
      .vault-soft { fill: #ccfbf1 !important; }
      .vault-white { fill: #ecfdf5 !important; }
      .vault-bright { fill: #99f6e4 !important; }
      .card { fill: #fff; stroke: #dbe2ee; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1320" height="900" rx="24" fill="#f5f7fb"/>
  <text x="58" y="55" class="tiny" fill="#4f46e5">REFERENCE ARCHITECTURE</text>
  <text x="58" y="100" font-size="31" font-weight="760">One orchestrator. Persistent memory. Focused agents.</text>
  <text x="58" y="130" font-size="16" class="muted">A personal AI operating system that routes work, preserves knowledge, and governs external actions.</text>

  <!-- Main actors -->
  <g filter="url(#shadow)">
    <rect x="58" y="178" width="235" height="112" rx="18" class="card"/>
    <rect x="358" y="162" width="430" height="145" rx="22" fill="url(#hero)"/>
    <rect x="855" y="153" width="407" height="190" rx="22" fill="url(#vault)"/>
  </g>
  <circle cx="91" cy="214" r="13" fill="#e0e7ff"/>
  <path d="M84,244 c2,-10 12,-15 20,-15 s18,5 20,15" fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round"/>
  <text x="119" y="218" font-size="19" font-weight="720">Human</text>
  <text x="82" y="263" class="body muted">Intent, priorities, approval</text>

  <text x="395" y="205" class="tiny soft-white">ORCHESTRATION LAYER</text>
  <text x="395" y="244" class="white" font-size="29" font-weight="760">Hermes</text>
  <text x="395" y="274" class="soft-white" font-size="15">Understands · routes · delegates · verifies</text>

  <text x="888" y="190" class="tiny vault-bright">PERSISTENT KNOWLEDGE LAYER</text>
  <text x="888" y="229" class="white" font-size="27" font-weight="760">Obsidian</text>
  <text x="888" y="255" class="vault-soft" font-size="14">Private, human-readable source of truth</text>
  <text x="888" y="286" class="vault-white" font-size="13">Curated memory · projects · sources</text>
  <text x="888" y="308" class="vault-white" font-size="13">Decisions · procedures · durable records</text>
  <text x="888" y="329" class="vault-bright" font-size="12" font-weight="700">PRIVATE VAULT — NEVER PUBLISH THE LIVE VAULT</text>

  <path d="M293 234 H344" class="line"/>
  <text x="300" y="218" class="body muted">request</text>
  <path d="M788 205 H837" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="791" y="190" font-size="12" fill="#0f766e">retrieve context</text>
  <path d="M837 282 H788" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
  <text x="792" y="303" font-size="12" fill="#0f766e">curated updates</text>

  <!-- Delegation bus -->
  <path d="M573 307 V374 H167 M573 374 H1151" fill="none" stroke="#a5b4fc" stroke-width="2.5"/>
  <text x="58" y="407" class="tiny" fill="#4f46e5">SPECIALIST AGENTS · NARROW RESPONSIBILITIES AND LEAST-PRIVILEGE ACCESS</text>
  <path d="M167 374 V416" class="line"/>
  <path d="M495 374 V416" class="line"/>
  <path d="M823 374 V416" class="line"/>
  <path d="M1151 374 V416" class="line"/>

  <!-- Specialist cards -->
  <g filter="url(#shadow)">
    <rect x="58" y="432" width="250" height="166" rx="18" class="card"/>
    <rect x="386" y="432" width="250" height="166" rx="18" class="card"/>
    <rect x="714" y="432" width="250" height="166" rx="18" class="card"/>
    <rect x="1042" y="432" width="220" height="166" rx="18" class="card"/>
  </g>
  <rect x="58" y="432" width="250" height="8" rx="4" fill="#0ea5e9"/>
  <rect x="386" y="432" width="250" height="8" rx="4" fill="#f59e0b"/>
  <rect x="714" y="432" width="250" height="8" rx="4" fill="#ec4899"/>
  <rect x="1042" y="432" width="220" height="8" rx="4" fill="#22c55e"/>

  <text x="80" y="472" class="label">Media &amp; LinkedIn</text>
  <text x="80" y="502" class="body muted">Monitor relevant sources</text>
  <text x="80" y="524" class="body muted">Verify and document appearances</text>
  <text x="80" y="546" class="body muted">Keep dates, citations, links</text>
  <text x="80" y="578" font-size="12" font-weight="700" fill="#0369a1">RESEARCH · RECORD</text>

  <text x="408" y="472" class="label">Travel operations</text>
  <text x="408" y="502" class="body muted">Track upcoming trips</text>
  <text x="408" y="524" class="body muted">Maintain relevant logistics</text>
  <text x="408" y="546" class="body muted">Retire completed travel</text>
  <text x="408" y="578" font-size="12" font-weight="700" fill="#b45309">PLAN · UPDATE</text>

  <text x="736" y="472" class="label">Content creation</text>
  <text x="736" y="502" class="body muted">Research and develop ideas</text>
  <text x="736" y="524" class="body muted">Draft and adapt by channel</text>
  <text x="736" y="546" class="body muted">Publishing needs approval</text>
  <text x="736" y="578" font-size="12" font-weight="700" fill="#be185d">RESEARCH · CREATE</text>

  <text x="1064" y="472" class="label">Invoicing</text>
  <text x="1064" y="502" class="body muted">Collect billing inputs</text>
  <text x="1064" y="524" class="body muted">Prepare private files</text>
  <text x="1064" y="546" class="body muted">Protect financial data</text>
  <text x="1064" y="578" font-size="12" font-weight="700" fill="#15803d">PREPARE · PROTECT</text>

  <!-- Results and guardrails -->
  <path d="M183 598 V628 M511 598 V628 M839 598 V628 M1152 598 V628 M183 628 H1152" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <path d="M605 628 V318" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="610" y="607" width="266" height="25" rx="7" fill="#f5f7fb"/>
  <text x="615" y="623" class="body muted">findings and drafts return to Hermes</text>

  <g filter="url(#shadow)">
    <rect x="58" y="665" width="350" height="132" rx="18" class="card"/>
    <rect x="485" y="665" width="350" height="132" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="912" y="665" width="350" height="132" rx="18" class="card"/>
  </g>
  <text x="84" y="702" class="tiny" fill="#475569">INPUTS &amp; TOOLS</text>
  <text x="84" y="735" class="label">Web · files · calendar · services</text>
  <text x="84" y="763" class="body muted">Enabled per task; credentials stay private.</text>

  <text x="511" y="702" class="tiny" fill="#c2410c">HUMAN APPROVAL GATE</text>
  <text x="511" y="735" class="label">Publishing · messaging · payments</text>
  <text x="511" y="763" class="body muted">No external action from a draft alone.</text>

  <text x="938" y="702" class="tiny" fill="#0f766e">VERIFIED OUTCOME</text>
  <text x="938" y="735" class="label">Check the result, then preserve it</text>
  <text x="938" y="763" class="body muted">Durable, sourced notes return to Obsidian.</text>

  <path d="M408 731 H470" class="line"/>
  <path d="M835 731 H897" class="line"/>
  <text x="58" y="850" font-size="13" class="muted">Public repository = reusable method and sanitized examples. Private Obsidian vault = real memory and personal operational context.</text>
  <text x="58" y="875" font-size="12" fill="#64748b">Obsidian stores knowledge. Hermes coordinates work. Specialists execute bounded tasks. The human retains authority.</text>
</svg>
